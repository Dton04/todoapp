---
- name: Setup VPS, Install Docker & Deploy Git Project
  hosts: vps
  become: true
  vars:
    git_repo_url: "https://github.com/Dton04/todoapp.git"
    app_dir: "/app/todoapp"

  tasks:
    - name: 1. Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Install Git and prerequisite tools
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: 3. Setup 2GB Swap (Dam bao VPS 1CPU/1GB RAM build khong bi tran RAM)
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      changed_when: false

    - name: 4. Install Docker & Docker Compose via official script
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: 5. Ensure Docker service is active and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: 6. Clone source code from Git to VPS directory
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: 7. Ensure backend .env exists
      copy:
        src: "{{ app_dir }}/backend/.env.example"
        dest: "{{ app_dir }}/backend/.env"
        remote_src: yes
        force: no

    - name: 8. Truy cap thu muc vua clone va dung docker-compose build source
      shell: |
        docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      register: compose_output

    - name: 9. Display build and deploy results
      debug:
        var: compose_output.stdout_lines

    - name: 10. Check list of running containers
      command: docker ps
      register: docker_ps_output
      changed_when: false

    - name: 11. Print active containers
      debug:
        var: docker_ps_output.stdout_lines
