services:
  # Hardware metrics collector (CPU, RAM, Disk, Load)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: mern-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  # MongoDB Database metrics collector
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mern-mongodb-exporter
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    ports:
      - "9216:9216"
    depends_on:
      - mongodb

  # Prometheus Server
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: mern-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
      - mongodb-exporter

  # Grafana Dashboard UI
  grafana:
    image: grafana/grafana:10.3.3
    container_name: mern-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000" # Expose Grafana on port 3001 on host to avoid port 3000 collision with React
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
