version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mern-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: mern-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/todo-app
      - PORT=8000
      - JWT_SECRET=BI_MAT
      # You can add GMAIL_USERNAME and GMAIL_PASSWORD here if needed
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: mern-frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mongo-data:
